# Exercice 6 - Premier pipeline CI avec le Marketplace
# Actions évaluées à des commits spécifiques pour sécurité
name: CI - Tests Python

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Checkout du code - pinné à un SHA complet pour sécurité
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      # Setup Python - pinné pour garantir la version exacte
      - uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécuter les tests pytest
        run: pytest -v
