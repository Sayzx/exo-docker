# Exercice 5 - Plusieurs jobs et dépendances
name: Pipeline Multi-Job

on:
  push:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Linting..."

  test:
    runs-on: windows-latest
    needs: lint
    steps:
      - run: echo "Testing on Windows..."

  build:
    runs-on: macos-latest
    needs: [lint, test]
    steps:
      - run: echo "Building on macOS..."

  notify:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - run: echo "Notification de statut final"
      - run: echo "Job lint: ${{ needs.lint.result }}"
      - run: echo "Job test: ${{ needs.test.result }}"
      - run: echo "Job build: ${{ needs.build.result }}"
