# Exercice 8 - Exécution conditionnelle et expressions
name: Smart Conditional Workflow

on:
  push:
    tags:
      - 'v*'
  pull_request:

jobs:
  job-a:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Extraire version du tag
        id: get-version
        run: echo "version=$(git describe --tags --abbrev=0 2>/dev/null || echo '1.0.0')" >> $GITHUB_OUTPUT

      - name: Main branch only
        if: github.ref == 'refs/heads/main'
        run: echo "On exécute que sur main"

      - name: PR with 'deploy' label
        if: contains(github.event.pull_request.labels.*.name, 'deploy')
        run: echo "PR marquée avec 'deploy'"

  job-b:
    runs-on: ubuntu-latest
    needs: job-a

    steps:
      - name: Consommer sortie de Job A
        run: echo "Version: ${{ needs.job-a.outputs.version }}"

      - name: Version tag detected
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "Déploiement de version détecté"

      - name: Étape intentionnellement en échec
        run: exit 1
        continue-on-error: true

      - name: Execute only on previous failure
        if: failure()
        run: echo "L'étape précédente a échoué, on exécute une action correctrice"
